[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ctxfit"
dynamic = ["version"]
description = "Drop-in context-window optimizer for any agent loop: structural compression, section budgets, framework adapters"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Calas Automations Inc." }]
keywords = [
    "llm", "agents", "context-window", "token-optimization", "prompt-engineering",
    "context-compression", "tool-output", "openai", "anthropic", "langchain",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]

[project.optional-dependencies]
tiktoken = ["tiktoken>=0.5"]
dev = ["pytest>=8", "ruff>=0.4"]

[project.scripts]
ctxfit = "ctxfit.cli:main"

[project.urls]
Homepage = "https://calasautomations.com"
Repository = "https://github.com/calasdan-sketch/ctxfit"
Issues = "https://github.com/calasdan-sketch/ctxfit/issues"
Changelog = "https://github.com/calasdan-sketch/ctxfit/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { attr = "ctxfit.__version__" }

[tool.setuptools.package-data]
ctxfit = ["prices.json", "demo/*.jsonl", "py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["E501"]
